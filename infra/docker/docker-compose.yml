services:
  postgres:
    image: postgres:17-alpine
    container_name: stampify-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: digitalstamp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stampify-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: stampify-api
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/digitalstamp?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: stampify-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
